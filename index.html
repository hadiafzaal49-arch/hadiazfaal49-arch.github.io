<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdul Hadi | Official Profile</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    color:#fff;
    background:#070914;
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    background:#6d28d9;
    filter:blur(110px);
    opacity:.35;
    top:-80px;
    left:-80px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    background:#06b6d4;
    filter:blur(110px);
    opacity:.25;
    bottom:-80px;
    right:-80px;
    z-index:-1;
}

.container{
    width:92%;
    max-width:650px;
    margin:auto;
    padding:45px 0;
}

/* PROFILE */

.profile{
    text-align:center;
}

.profile-photo{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
    box-shadow:0 0 45px rgba(139,92,246,.45);
}

.profile-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:linear-gradient(145deg,#151a32,#242a4d);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    font-weight:800;
}

h1{
    margin-top:18px;
    font-size:32px;
    font-weight:800;
}

.verified{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    margin-left:5px;
    border-radius:50%;
    background:#3b82f6;
    font-size:12px;
}

.username{
    margin-top:5px;
    color:#aeb7d1;
    font-size:14px;
}

.bio{
    margin:16px auto 0;
    max-width:520px;
    color:#d5d9e8;
    line-height:1.7;
    font-size:14px;
}

/* BUTTONS */

.socials{
    margin-top:32px;
}

.social{
    display:flex;
    align-items:center;
    text-decoration:none;
    color:#fff;

    padding:15px 17px;
    margin:13px 0;

    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;

    background:rgba(255,255,255,.055);
    backdrop-filter:blur(15px);

    transition:.25s;
}

.social:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.11);
    border-color:rgba(255,255,255,.25);
}

.icon{
    width:45px;
    height:45px;
    border-radius:14px;

    display:flex;
    align-items:center;
       justify-content: center;
    font-size: 42px;
    font-weight: bold;
    box-shadow: 0 10px 30px #0008;
}

h1 {
    margin-top: 20px;
    font-size: 40px;
}

.subtitle {
    margin-top: 8px;
    color: #d1d5db;
    font-size: 18px;
}

.about {
    margin-top: 30px;
    padding: 22px;
    border-radius: 20px;
    background: #ffffff18;
    border: 1px solid #ffffff30;
}

.about p {
    margin: 10px;
}

.links {
    margin-top: 20px;
}

.links a {
    display: block;
    margin: 12px 0;
    padding: 16px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    background: #ffffff18;
    border: 1px solid #ffffff30;
}

.links a:hover {
    background: #ffffff35;
}

footer {
    margin-top: 30px;
    color: #cbd5e1;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">AH</div>

    <h1>Abdul Hadi</h1>

    <p class="subtitle">
        Student • Lahore, Pakistan
    </p>

    <div class="about">
        <p>👋 Welcome to my personal website!</p>
        <p>🎓 Student</p>
        <p>📍 Lahore, Pakistan</p>
        <p>✨ Mehar Arain</p>
    </div>

    <div class="links">

        <a href="https://instagram.com/iamhadi130" target="_blank">
            📸 Instagram — @iamhadi130
        </a>

        <a href="https://facebook.com/iamhadi130" target="_blank">
            📘 Facebook — @iamhadi130
        </a>

        <a href="https://www.snapchat.com/" target="_blank">
            👻 Snapchat — @iamhadi130
        </a>

    </div>

    <footer>
        © 2026 Abdul Hadi
    </footer>

</div>

</body>
  </html>
